<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Bodywork</title>
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:2rem;">
  <div style="text-align:center;max-width:400px;">
    <div style="font-size:4rem;margin-bottom:1rem;">📡</div>
    <h1 style="font-size:1.5rem;color:var(--accent);margin-bottom:0.75rem;">No Internet Connection</h1>
    <p style="color:var(--text-muted);font-size:1.1rem;line-height:1.6;margin-bottom:1.5rem;">
      Please check your connection and try again.
    </p>
    <button class="btn btn-primary" onclick="window.location.reload()" style="font-size:1.1rem;">
      Try Again
    </button>
  </div>
</div>
</body>
</html>
