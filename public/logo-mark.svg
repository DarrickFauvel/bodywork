<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Lower body -->
  <rect x="5" y="40" width="90" height="16" rx="4" fill="white"/>

  <!-- Cabin — smooth bezier roof arc -->
  <path d="M 17,40
           C 17,40 22,18 34,15
           L 66,15
           C 78,15 83,40 83,40 Z"
        fill="white"/>

  <!-- Window — dark tint cutout -->
  <path d="M 30,38
           C 30,38 33,22 41,20
           L 59,20
           C 67,20 70,38 70,38 Z"
        fill="rgba(0,0,0,0.22)"/>

  <!-- Wheels -->
  <circle cx="27" cy="59" r="12" fill="rgba(0,0,0,0.25)"/>
  <circle cx="73" cy="59" r="12" fill="rgba(0,0,0,0.25)"/>

  <!-- Rims -->
  <circle cx="27" cy="59" r="5" fill="white" opacity="0.9"/>
  <circle cx="73" cy="59" r="5" fill="white" opacity="0.9"/>

  <!-- Hub -->
  <circle cx="27" cy="59" r="2" fill="rgba(0,0,0,0.3)"/>
  <circle cx="73" cy="59" r="2" fill="rgba(0,0,0,0.3)"/>
</svg>
