<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#1a1a1a"/>

  <!--
    Sports car: long hood (front right), short mid-mounted cabin,
    fastback rear, low stance, large wheels
  -->

  <!-- Main body silhouette -->
  <path d="
    M 7,65
    L 7,58
    C 9,52 13,49 19,47
    L 27,44
    C 30,41 34,38 39,37
    L 44,35
    C 47,34 51,33 54,33
    L 60,34
    C 64,35 67,38 69,42
    L 77,48
    C 82,49 87,51 90,54
    C 93,57 93,61 93,64
    L 93,65 Z
  " fill="#f97316"/>

  <!-- Darker lower body sill -->
  <rect x="7" y="61" width="86" height="4" rx="1.5" fill="#d4600a"/>

  <!-- Window glass — raked, sporty -->
  <path d="
    M 40,58
    L 43,41
    C 44,38 47,35 51,35
    L 57,35
    C 61,36 64,39 65,43
    L 67,58 Z
  " fill="#0c0c0c" opacity="0.7"/>

  <!-- Window glare streak -->
  <line x1="45" y1="56" x2="48" y2="39" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.18"/>

  <!-- Rear spoiler blade -->
  <rect x="7" y="42" width="14" height="2.5" rx="1.2" fill="#f97316"/>
  <!-- Spoiler mount -->
  <rect x="12" y="44" width="3" height="5" rx="1" fill="#d4600a"/>

  <!-- Front splitter -->
  <rect x="88" y="63" width="6" height="2.5" rx="1" fill="#d4600a"/>

  <!-- Angular headlight -->
  <path d="M 87,54 L 93,56 L 93,60 L 87,59 Z" fill="#fef3c7" opacity="0.95"/>
  <!-- Headlight DRL -->
  <line x1="87" y1="55" x2="93" y2="57" stroke="white" stroke-width="0.8" opacity="0.6"/>

  <!-- Taillight strip (wide, thin — sports car style) -->
  <rect x="7" y="54" width="5" height="5" rx="1" fill="#fca5a5" opacity="0.95"/>
  <!-- Inner taillight -->
  <rect x="7" y="55.5" width="3" height="2" rx="0.5" fill="white" opacity="0.4"/>

  <!-- Front wheel — large, pushed to rear of long hood -->
  <circle cx="74" cy="72" r="12.5" fill="#111"/>
  <circle cx="74" cy="72" r="12.5" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Rim -->
  <circle cx="74" cy="72" r="6.5" fill="#252525"/>
  <!-- 5 spokes -->
  <line x1="74" y1="65.5" x2="74" y2="78.5" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="67.5" y1="72" x2="80.5" y2="72" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="69.4" y1="67.4" x2="78.6" y2="76.6" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="78.6" y1="67.4" x2="69.4" y2="76.6" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="74" cy="72" r="2.5" fill="#f97316"/>

  <!-- Rear wheel -->
  <circle cx="26" cy="72" r="12.5" fill="#111"/>
  <circle cx="26" cy="72" r="12.5" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="26" cy="72" r="6.5" fill="#252525"/>
  <line x1="26" y1="65.5" x2="26" y2="78.5" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="19.5" y1="72" x2="32.5" y2="72" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="21.4" y1="67.4" x2="30.6" y2="76.6" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="30.6" y1="67.4" x2="21.4" y2="76.6" stroke="#f97316" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="26" cy="72" r="2.5" fill="#f97316"/>
</svg>
