<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#1a1a1a"/>

  <!-- Lower body -->
  <rect x="7" y="53" width="86" height="16" rx="4" fill="#f97316"/>

  <!-- Cabin — smooth bezier roof arc -->
  <path d="M 19,53
           C 19,53 23,30 35,27
           L 65,27
           C 77,27 81,53 81,53 Z"
        fill="#f97316"/>

  <!-- Window glass — inset with subtle dark tint -->
  <path d="M 32,51
           C 32,51 35,35 43,33
           L 57,33
           C 65,33 68,51 68,51 Z"
        fill="#0f0f0f" opacity="0.55"/>

  <!-- Window highlight — thin bright strip at top -->
  <path d="M 44,33 C 49,32 55,32 57,33 C 55,31 51,30 49,30 Z"
        fill="white" opacity="0.25"/>

  <!-- Headlight -->
  <rect x="84" y="57" width="8" height="5" rx="2.5" fill="#fde68a" opacity="0.9"/>

  <!-- Taillight -->
  <rect x="8" y="57" width="7" height="5" rx="2.5" fill="#f87171" opacity="0.85"/>

  <!-- Wheels -->
  <circle cx="27" cy="71" r="12" fill="#111"/>
  <circle cx="73" cy="71" r="12" fill="#111"/>

  <!-- Tyre shine ring -->
  <circle cx="27" cy="71" r="12" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="73" cy="71" r="12" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Rim -->
  <circle cx="27" cy="71" r="5.5" fill="#2e2e2e"/>
  <circle cx="73" cy="71" r="5.5" fill="#2e2e2e"/>

  <!-- Rim spokes -->
  <line x1="27" y1="65.5" x2="27" y2="76.5" stroke="#f97316" stroke-width="1.2"/>
  <line x1="21.5" y1="71" x2="32.5" y2="71" stroke="#f97316" stroke-width="1.2"/>
  <line x1="23.1" y1="67.1" x2="30.9" y2="74.9" stroke="#f97316" stroke-width="1.2"/>
  <line x1="30.9" y1="67.1" x2="23.1" y2="74.9" stroke="#f97316" stroke-width="1.2"/>

  <line x1="73" y1="65.5" x2="73" y2="76.5" stroke="#f97316" stroke-width="1.2"/>
  <line x1="67.5" y1="71" x2="78.5" y2="71" stroke="#f97316" stroke-width="1.2"/>
  <line x1="69.1" y1="67.1" x2="76.9" y2="74.9" stroke="#f97316" stroke-width="1.2"/>
  <line x1="76.9" y1="67.1" x2="69.1" y2="74.9" stroke="#f97316" stroke-width="1.2"/>

  <!-- Hub cap -->
  <circle cx="27" cy="71" r="2" fill="#f97316"/>
  <circle cx="73" cy="71" r="2" fill="#f97316"/>
</svg>
